[package]
name = "cellwake"
version = "0.1.0"
description = "A live, read-only spreadsheet viewer for watching a workbook while an AI agent edits it"
authors = ["Thomas Rice"]
license = "MIT"
edition = "2024"
default-run = "cellwake"

[lib]
name = "cellwake_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
ironcalc = "0.9.1"
ironcalc_base = "0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
notify = "8"
similar = "2"
regex = "1"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
