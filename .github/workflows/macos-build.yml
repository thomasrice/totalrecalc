name: macOS build

# Run by hand to get an unsigned macOS build (Apple Silicon and Intel in
# one .dmg) of any branch without tagging a release.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      # pnpm's version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --target universal-apple-darwin --bundles dmg
      - name: Collect
        run: |
          mkdir -p out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg out/totalrecalc-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: totalrecalc-macos
          path: out/
          retention-days: 14
