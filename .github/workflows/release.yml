name: Release

# Push a tag such as v0.1.0 to build Linux and Windows packages, attach them
# to a GitHub release under both their versioned names and stable names (so
# https://github.com/thomasrice/totalrecalc/releases/latest/download/<name>
# always works), add checksums, and publish once everything is uploaded.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # The oldest supported Ubuntu, so the AppImage and .deb run on older glibc.
          - os: ubuntu-22.04
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match tauri.conf.json version $version" >&2
            exit 1
          fi
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      # pnpm's version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Total Recalc ${{ env.TAG }}
          releaseDraft: true
          prerelease: ${{ contains(env.TAG, '-') }}
      - name: Upload stable names (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p stable
          cp src-tauri/target/release/bundle/deb/*.deb stable/totalrecalc-linux-amd64.deb
          cp src-tauri/target/release/bundle/appimage/*.AppImage stable/totalrecalc-linux-amd64.AppImage
          gh release upload "$TAG" stable/* --clobber
      - name: Upload stable names (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p stable
          cp src-tauri/target/release/bundle/nsis/*-setup.exe stable/totalrecalc-windows-x64-setup.exe
          cp src-tauri/target/release/totalrecalc.exe stable/totalrecalc.exe
          gh release upload "$TAG" stable/* --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checksums, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG"
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
          # Pre-release tags (v0.2.0-beta.1) never become "latest".
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
